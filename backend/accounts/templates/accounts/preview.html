<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WALLFLOW authentication preview</title>
</head>
<body>
  <main>
    <h1>WALLFLOW authentication preview</h1>
    {% if account %}
      <p>Signed in as {{ account.display_name|default:account.email|default:"Google account" }}.</p>
      <p><a href="{% url 'auth-me' %}">View current account response</a></p>
      <form method="post" action="{% url 'preview-workspace' %}">
        {% csrf_token %}
        <button type="submit">Sign out</button>
      </form>
    {% else %}
      {% if message %}<p role="status">{{ message }}</p>{% endif %}
      <form method="post" action="{% url 'auth-google-start' %}">
        {% csrf_token %}
        <button type="submit">Continue with Google</button>
      </form>
    {% endif %}
  </main>
</body>
</html>
